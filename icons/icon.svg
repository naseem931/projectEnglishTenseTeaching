<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Time Circle Axis Indicator -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="#ffffff" stroke-width="12" stroke-dasharray="8 12" opacity="0.35"/>
  <circle cx="256" cy="270" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="140 300" stroke-linecap="round"/>

  <!-- Academic Graduation Cap Symbol (Teaching) -->
  <g filter="url(#shadow)">
    <!-- Cap Top Rhombus -->
    <path d="M 256 120 L 416 195 L 256 270 L 96 195 Z" fill="#ffffff"/>
    
    <!-- Cap Under Skullcap -->
    <path d="M 160 225 L 160 280 C 160 325 352 325 352 280 L 352 225 L 256 270 Z" fill="#e2e8f0"/>

    <!-- Tassel Button & Cord -->
    <circle cx="256" cy="195" r="9" fill="url(#goldGrad)"/>
    <path d="M 256 195 Q 380 210 395 285" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <rect x="388" y="285" width="14" height="32" rx="6" fill="url(#goldGrad)"/>
  </g>

  <!-- Dynamic Timeline Arrows Below -->
  <g transform="translate(146, 370)">
    <line x1="0" y1="20" x2="220" y2="20" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <!-- Past Node -->
    <circle cx="20" cy="20" r="10" fill="#f59e0b"/>
    <!-- Now Node (Centered Glow) -->
    <circle cx="110" cy="20" r="14" fill="#ffffff"/>
    <circle cx="110" cy="20" r="8" fill="#3b82f6"/>
    <!-- Future Node -->
    <circle cx="200" cy="20" r="10" fill="#10b981"/>
  </g>
</svg>
